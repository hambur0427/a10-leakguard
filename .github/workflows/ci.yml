name: ci audit negative control

on:
  push:
    branches: [validation/pip-audit-failure]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r 03_維運QA_任務3/requirements.txt

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r 03_維運QA_任務3/requirements.txt

      - name: Run tests
        working-directory: 03_維運QA_任務3
        run: pytest -q

