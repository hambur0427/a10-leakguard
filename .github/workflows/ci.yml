name: ci

on:
  push:
    branches: [main, 'task2/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r 03_維運QA_任務3/requirements.txt

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r 03_維運QA_任務3/requirements.txt

      - name: Run tests
        working-directory: 03_維運QA_任務3
        run: pytest -q

  # Only trusted pushes receive the environment secret. No checkout, dependencies,
  # or repository/PR code execute in this job, and the value is never printed.
  staging-secret-check:
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    environment: staging
    steps:
      - name: Verify staging secret injection without disclosure
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        shell: bash
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::staging SECRET_KEY is missing"
            exit 1
          fi
          echo "staging SECRET_KEY is available (value not displayed)"
